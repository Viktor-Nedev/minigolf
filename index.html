<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Mini Golf</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="game-container">
        <!-- Background Canvas for static elements if needed -->
        <canvas id="game-canvas"></canvas>

        <!-- UI Layer -->
        <div id="ui-layer">
            
            <!-- Main Menu -->
            <div id="main-menu" class="screen active">
                <div class="glass-panel">
                    <h1 class="glow-text">MINI GOLF</h1>
                    <p class="subtitle">A Realistic Mini Golf Experience</p>
                    
                    <div class="ball-selector-container">
                        <h3>Select Your Ball</h3>
                        <div class="ball-options" id="ball-options">
                            <!-- Populated by JS -->
                        </div>
                        <div class="ball-stats" id="ball-stats">
                            <div>Speed: <span id="stat-speed"></span></div>
                            <div>Bounce: <span id="stat-bounce"></span></div>
                            <div>Weight: <span id="stat-weight"></span></div>
                        </div>
                    </div>

                    <button id="btn-play" class="primary-btn">PLAY NOW</button>
                    <div class="menu-controls">
                        <span>Drag to aim • Release to shoot</span>
                    </div>
                </div>
            </div>

            <!-- In Game HUD -->
            <div id="hud" class="screen">
                <div class="hud-top glass-panel-small">
                    <div class="hud-item">
                        <span class="label">LEVEL</span>
                        <span class="value" id="hud-level">1/5</span>
                    </div>
                    <div class="hud-item">
                        <span class="label">STROKES</span>
                        <span class="value" id="hud-strokes">0</span>
                    </div>
                    <div class="hud-item">
                        <span class="label">PAR</span>
                        <span class="value" id="hud-par">3</span>
                    </div>
                </div>
                <button id="btn-restart" class="secondary-btn icon-btn" title="Restart Level">↻</button>
            </div>

            <!-- Level Complete Screen -->
            <div id="level-complete" class="screen">
                <div class="glass-panel">
                    <h2 class="glow-text-small" id="lc-title">HOLE IN ONE!</h2>
                    <div class="stats-grid">
                        <div class="stat-box">
                            <span class="label">Par</span>
                            <span class="value" id="lc-par">3</span>
                        </div>
                        <div class="stat-box">
                            <span class="label">Strokes</span>
                            <span class="value" id="lc-strokes">1</span>
                        </div>
                        <div class="stat-box highlight">
                            <span class="label">Score</span>
                            <span class="value" id="lc-score">-2</span>
                        </div>
                    </div>
                    <button id="btn-next-level" class="primary-btn">NEXT HOLE</button>
                </div>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over" class="screen">
                <div class="glass-panel">
                    <h2 class="glow-text">COURSE COMPLETE</h2>
                    <div class="final-score">
                        <span class="label">Total Score</span>
                        <span class="value glow-text-small" id="go-score">0</span>
                    </div>
                    <p id="go-message" class="subtitle">Amazing performance!</p>
                    <button id="btn-home" class="primary-btn">MAIN MENU</button>
                </div>
            </div>

        </div>
    </div>
    
    <script src="game.js"></script>
</body>
</html>
